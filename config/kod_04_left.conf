# 左手専用：ペリフェラル側

# 分割キーボード：ペリフェラル
CONFIG_ZMK_SPLIT=y
# CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y  ← コメントアウト（削除）

# BLE接続
CONFIG_ZMK_BLE=y

# USB接続（デバッグ時のみ）
CONFIG_ZMK_USB=y

# ロータリーエンコーダ
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# 省電力設定
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ログオフ
CONFIG_LOG=n

# ポインティング機能は不要（右側のみ）
# CONFIG_ZMK_POINTING=y  ← 削除
# CONFIG_INPUT=y         ← 削除
