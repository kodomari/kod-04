CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y

CONFIG_ZMK_USB_LOGGING=y        # USBログ出力
CONFIG_LOG=y                     # ログ全般
CONFIG_LOG_MODE_IMMEDIATE=y      # 即座にログ出力
CONFIG_LOG_BUFFER_SIZE=8192      # バッファサイズ
CONFIG_INPUT_LOG_LEVEL_DBG=y     # INPUT（PS/2含む）デバッグログ

# 省電力設定
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth設定
CONFIG_BT_CTLR_TX_PWR_MINUS_20=y

